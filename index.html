<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>選戰狂人夢 Election War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4D9BF; --surface:#F2E9D3; --paper:#E8DEC5; --ink:#14100C; --muted:#5C4E3E; --line:#B9AA88;
  --red:#B3261E; --mustard:#D4A53A; --btn:#14100C; --btn-ink:#F2E9D3; --shadow:#B3261E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120E; --surface:#231B15; --paper:#E8DEC5; --ink:#EDE3CA; --muted:#B5A78C; --line:#4A3C2E;
    --red:#D13A30; --mustard:#D4A53A; --btn:#D4A53A; --btn-ink:#14100C; --shadow:#8E1F1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120E; --surface:#231B15; --paper:#E8DEC5; --ink:#EDE3CA; --muted:#B5A78C; --line:#4A3C2E;
  --red:#D13A30; --mustard:#D4A53A; --btn:#D4A53A; --btn-ink:#14100C; --shadow:#8E1F1F;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;
  background-image:radial-gradient(rgba(127,110,80,.13) 1px,transparent 1.6px);background-size:6px 6px}
h1,h2,h3,p{margin:0}
.serif{font-family:"Noto Serif TC","Noto Sans TC",serif;font-weight:900}
.wrap{max-width:580px;margin:0 auto;padding:12px 14px 40px}
.mast{margin:10px 0 14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mast h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(2.3rem,11vw,3.4rem);line-height:1.1;letter-spacing:.05em;
  background:var(--red);color:#F2E9D3;padding:2px 16px 4px;border:4px solid #14100C;transform:rotate(-2deg)}
.mast .sub{font-weight:900;letter-spacing:.3em;color:var(--muted);font-size:.85rem;margin-left:4px}
.lead{margin:8px 0 4px}
.block{margin:18px 0}
.block>h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.1rem;margin-bottom:8px}
.art{background:var(--paper);border-radius:4px;display:block}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.char{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;min-width:0}
.char img{width:100%;aspect-ratio:1}
.char span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.char.on{border-color:var(--red);box-shadow:4px 4px 0 var(--red)}
.info{background:var(--surface);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);padding:12px;margin-top:12px;display:grid;grid-template-columns:96px 1fr;gap:12px}
.info img{width:96px;height:96px}
.info h3{font-family:"Noto Serif TC",serif;font-size:1.3rem}
.info dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:.84rem}
.info dt{color:var(--muted);font-weight:700;white-space:nowrap}.info dd{margin:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.opt{font:inherit;padding:8px 12px;border-radius:4px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.seg button.on,.opt.on{border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
#seed{font:inherit;width:100%;padding:10px;border-radius:4px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.primary{display:block;width:100%;font:inherit;font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.2rem;padding:13px;border:3px solid #14100C;border-radius:4px;background:var(--btn);color:var(--btn-ink);cursor:pointer;margin:16px 0 8px;box-shadow:5px 5px 0 var(--shadow)}
.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.fine{font-size:.8rem;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.topbar b{font-family:"Noto Serif TC",serif;font-size:1.15rem}
.muted{color:var(--muted);font-size:.85rem}
.ticker{background:#14100C;color:#E8DEC5;border:3px solid #14100C;overflow:hidden;white-space:nowrap;font-weight:900;padding:7px 0;margin-bottom:12px;position:relative}
.ticker::before{content:"號外";position:absolute;left:0;top:0;bottom:0;background:var(--red);color:#F2E9D3;padding:7px 10px;z-index:1;font-family:"Noto Serif TC",serif}
.ticker span{display:inline-block;padding-left:100%;animation:marquee 26s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
.rule{background:var(--mustard);color:#14100C;font-weight:900;border:3px solid #14100C;padding:6px 10px;margin-bottom:10px;font-size:.9rem}
.opps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opp{background:var(--surface);border:3px solid var(--ink);padding:8px;min-width:0;display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.opp img{width:64px;height:64px}
.opp>div{min-width:0}
.opp.out{opacity:.55}
.nm{font-family:"Noto Serif TC",serif;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.votes{font-size:.85rem;font-weight:700}
.bar{height:7px;background:var(--line);margin:3px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.inv{font-size:.72rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tag{font-size:.68rem;font-weight:900;background:var(--mustard);color:#14100C;padding:0 5px;border:1.5px solid #14100C}
.tag.red{background:var(--red);color:#F2E9D3}
.flash{animation:shake .5s ease 1;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-4px) rotate(-1deg)}50%{transform:translateX(4px) rotate(1deg)}75%{transform:translateX(-2px)}}
.me{margin:14px 0;background:var(--surface);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);padding:10px}
.me-head{display:flex;gap:10px;align-items:center}
.me-head img{width:76px;height:76px;flex:none}
.me-id{min-width:0;flex:1}
.me-id .nm{font-size:1.25rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--bg);border:2px solid var(--line);padding:6px 10px}
.big{font-family:"Noto Serif TC",serif;font-size:1.45rem;font-weight:900;line-height:1.2}
.me dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:10px 0 0;font-size:.86rem}
.me dt{color:var(--muted);font-weight:700}.me dd{margin:0}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.act{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;min-height:56px;border-radius:4px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:900}
.act small{color:var(--muted);font-size:.7rem;font-weight:400;text-align:center;line-height:1.3}
.act.on{border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.act.skill{border-color:var(--mustard);grid-column:1/-1;flex-direction:row;gap:10px;min-height:48px}
.act:disabled{opacity:.38;cursor:not-allowed}
.detail h3{font-size:.92rem;margin:12px 0 6px;font-weight:900}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{text-align:left;font-size:.9rem;font-weight:700}
.opt small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}
.opt:disabled{opacity:.38;cursor:not-allowed}
.alarm{background:var(--surface);border:3px solid var(--red);box-shadow:4px 4px 0 var(--red);padding:10px;margin-bottom:10px}
.alarm h3{font-family:"Noto Serif TC",serif;color:var(--red);font-size:1.15rem;margin:0 0 4px}
.alarm.small{padding:6px 10px;box-shadow:none;font-size:.88rem}
.tut{text-align:left}.tut-img{width:110px;height:110px;margin:10px auto 4px}
.tut-body{font-size:.95rem;line-height:1.6}.tut-body p{margin:6px 0}.tut-body ol{margin:6px 0;padding-left:1.3em}.tut-body li{margin:4px 0}
.help{background:var(--surface);border-left:4px solid var(--mustard);padding:6px 10px;margin:10px 0 0;color:var(--ink)}
.topbar .snd+.snd{margin-left:6px}
.awards{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.awards li{display:flex;gap:6px;align-items:center;background:var(--surface);border:2px solid var(--line);padding:4px}
.awards img{width:44px;height:44px;flex:none}.awards b{display:block;font-size:.85rem}.awards span{font-size:.78rem;color:var(--muted)}
.share-img{max-width:min(440px,100%);max-height:70vh;border:3px solid #14100C;box-shadow:6px 6px 0 #B3261E}
.fx-btns a.dl{flex:1;text-align:center;font-weight:900;padding:12px;border:3px solid #14100C;background:#D4A53A;color:#14100C;text-decoration:none}
.opp{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.opp:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.infolink{font-size:.75rem;padding:0 0 0 8px;min-height:0;font-family:"Noto Sans TC",sans-serif;font-weight:400}
.info-card{max-height:72vh;overflow:auto}
.info-top{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;margin:10px 0}
.info-top img{width:110px;height:110px}
.info-top p{margin:2px 0}.info-q{font-weight:900}
.info-card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:6px 0 0;font-size:.9rem}
.info-card dt{font-weight:900;color:#5C4E3E;white-space:nowrap}.info-card dd{margin:0}
.info-card .muted{color:#5C4E3E}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.snd{font:inherit;font-size:1.2rem;background:var(--surface);border:2px solid var(--line);border-radius:4px;min-width:44px;min-height:44px;cursor:pointer}
.topbar .snd{margin-left:auto}
.char{position:relative}
.won{position:absolute;top:2px;right:2px;font-style:normal;font-size:.62rem;font-weight:900;background:var(--red);color:#F2E9D3;padding:0 4px;border:1.5px solid #14100C;transform:rotate(8deg);z-index:1}
.achs{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.achs li{background:var(--surface);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;opacity:.6}
.achs li.got{opacity:1;border-color:var(--mustard);box-shadow:3px 3px 0 var(--mustard)}
.achs li span{font-size:.84rem;color:var(--muted)}
.note{margin-top:8px;font-size:.82rem;color:var(--muted)}
.log{margin-top:12px}
.log details{border-top:2px solid var(--line);padding:8px 0}
.log summary{cursor:pointer;font-weight:900}
.log ul{margin:6px 0 0;padding-left:1.1em;font-size:.9rem}
.log li.hit{color:var(--red);font-weight:900}
.log li.out{font-weight:900}
.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px 0;min-height:44px}
/* playback */
.fx{position:fixed;inset:0;background:rgba(10,8,6,.86);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.fx-count{color:#B5A78C;font-weight:700;font-size:.85rem;margin-bottom:8px}
.fx-card{width:min(440px,100%);background:#E8DEC5;color:#14100C;border:4px solid #14100C;box-shadow:8px 8px 0 #B3261E;padding:14px;animation:slap .35s cubic-bezier(.2,1.6,.4,1) 1}
@keyframes slap{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-1deg);opacity:1}}
.fx-card{transform:rotate(-1deg)}
.fx-head{background:#14100C;color:#E8DEC5;font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem;padding:6px 10px;text-align:center}
.fx-stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:10px 0 4px}
.fx-stage.solo{grid-template-columns:1fr}
.fx-side{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-family:"Noto Serif TC",serif}
.fx-side img{width:min(140px,34vw);height:min(140px,34vw)}
.fx-arrow{font-family:"Noto Serif TC",serif;font-weight:900;font-size:2rem;color:#B3261E}
.fx-amt{text-align:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:2.4rem;line-height:1.1;animation:stamp .5s .2s both}
.fx-amt.loss{color:#B3261E}.fx-amt.gain{color:#8A6A10}
@keyframes stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.fx-hit img.t{animation:shake .5s .25s ease 2}

.fx-card.k-hit{background:#F0C7BC}.fx-card.k-hit .fx-head{background:#8E1F1F}
.fx-card.k-rally{background:#F1DA96}.fx-card.k-rally .fx-head{background:#6B4E0E}
.fx-card.k-rally .fx-amt.gain{color:#4A3700}
.fx-card.k-block{background:#C7CED4}.fx-card.k-block .fx-head{background:#2F3A44}
.fx-card.k-skill{background:#D8CBEA}.fx-card.k-skill .fx-head{background:#3E2A5E}
.fx-card.k-event{background:#E8DEC5}.fx-card.k-event .fx-head{background:#14100C}
.fx-card.k-out{background:#2A221B;color:#E8DEC5}.fx-card.k-out .fx-head{background:#B3261E}
.fx-card.k-out .fx-side img{background:#E8DEC5}
.fx-news{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem;line-height:1.4;background:#FFFFFF;color:#14100C;border:3px solid #14100C;padding:8px 10px;margin:10px 2px 2px;text-align:center;transform:rotate(-.6deg)}
.fx-quote{position:relative;background:#FFFFFF;color:#14100C;border:3px solid #14100C;border-radius:14px;padding:8px 12px;margin:6px 6px 2px;font-weight:900;text-align:center;font-size:1.02rem}
.fx-quote::before{content:"";position:absolute;top:-12px;left:24%;border:6px solid transparent;border-bottom:8px solid #14100C}
.fx-text{text-align:center;font-weight:700;margin-top:6px}
.fx-event{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(2rem,10vw,2.8rem);text-align:center;color:#B3261E;border:4px solid #B3261E;padding:10px 6px;margin:14px 8px 4px;transform:rotate(-3deg);animation:stamp .5s both}
.fx-btns{display:flex;gap:10px;margin-top:16px;width:min(440px,100%)}
.fx-btns button{flex:1;font:inherit;font-weight:900;padding:12px;min-height:48px;border:3px solid #14100C;background:#E8DEC5;color:#14100C;cursor:pointer}
.fx-btns button.go{background:#D4A53A}
.cert{background:#14100C;color:#E8DEC5;border:4px solid #14100C;box-shadow:8px 8px 0 var(--red);padding:18px 14px;text-align:center;margin:8px 0 18px}
.cert h1{font-family:"Noto Serif TC",serif;font-size:clamp(1.9rem,9vw,2.6rem);color:#D4A53A}
.cert img{width:130px;height:130px;margin:12px auto 6px}
.cert p{margin-top:6px}
.rank{list-style:none;padding:0;margin:0}
.rank li{display:grid;grid-template-columns:1.5em 36px 5em 1fr 4em;gap:6px;align-items:center;padding:4px 0;font-size:.88rem}
.rank img{width:36px;height:36px}
.rank .bar{margin:0}
.rank .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hl{margin:0;padding-left:1.1em}
@media (prefers-reduced-motion:reduce){
  .ticker span{padding-left:0;animation:none;white-space:normal}
  .ticker{white-space:normal;padding-left:52px}
  .flash,.fx-card,.fx-amt,.fx-hit img.t{animation:none}
}
</style>
</head>
<body>
<main id="app"></main>
<div id="fx"></div>

let G = null;
const SETUP = { char:null, n:4, rounds:20, seed:'', diff:'normal' };
const DIFF = { easy:'簡單', normal:'普通', hard:'困難' };
const P = id => G.players.find(p=>p.id===id);
const alive = () => G.players.filter(p=>p.alive);
const human = () => G.players.find(p=>p.isHuman);
const nm = p => p.isHuman ? '你' : p.name;
const others = p => alive().filter(x=>x!==p);
const leaderOf = (arr) => { const a=arr||alive(); return a.length ? maxBy(a,p=>p.votes) : null; };
const lowestOf = (arr) => { const a=arr||alive(); return a.length ? minBy(a,p=>p.votes) : null; };
function loseVotes(p,n){ const l=Math.min(Math.max(0,Math.round(n)),p.votes); p.votes-=l; G.pool+=Math.floor(l/2); return l; }
function addFunds(p,n){ p.funds=Math.max(0,Math.min(FUND_CAP,p.funds+n)); }
function range(v){ const lo=Math.floor(v/10)*10; return [lo,lo+10]; }
function moodOf(p){ if(!p.alive) return 'down'; if(G.flash.has(p.id) || p.votes<40) return 'sweat'; return 'happy'; }
const tr = p => p.t;
const boostOff = p => p.alarm==='boost' ? 1 : 0;
function matCost(p,k){ return Math.max(1, MAT[k].cost + ((tr(p).matCost||{})[k]||0) - boostOff(p)); }
function chanCost(p,k){ return Math.max(1, CHAN[k].cost + ((tr(p).chanCost||{})[k]||0) - boostOff(p)); }
function defCost(p,k){ return Math.max(1, DEF[k].cost + (tr(p).defCostAdd||0) - boostOff(p)); }
function rallyCost(p){ return Math.max(1,(tr(p).rallyCost ?? 2) - boostOff(p)); }
const ALARM_TXT = { boost:'告急催票：造勢與爆料 +50%，所有成本 -1', double:'背水一戰：每回合行動兩次（第二個不能用技能）' };
function updateAlarms(L){
  const al=alive(); if(al.length<2) return;
  const lead=leaderOf(al), low=lowestOf(al);
  al.forEach(p=>{
    const gap=lead.votes-p.votes;
    if(p.alarm){
      if(p!==low || gap<=20){ p.alarm=null; ev(L,'解除告急',`${nm(p)}追上來了，解除告急狀態。`,{ a:p.id }); }
    } else if(p===low && p!==lead && (gap>=40 || p.votes<lead.votes/2)){
      if(p.isHuman){ p.alarm='pending'; ev(L,'告急！','你落後太多，進入告急狀態，請選擇一種效果。',{ a:p.id }); }
      else { p.alarm = (p.funds>=5 && R()<0.5) ? 'double' : 'boost'; ev(L,'告急！',`${nm(p)}宣布告急：${ALARM_TXT[p.alarm]}。`,{ a:p.id }); }
    }
  });
}
function defLimit(p){ return tr(p).defLimit || 2; }
function earlyCut(){ return Math.max(1, Math.floor(G.max*0.4)); }
function lateStart(){ return G.max - Math.floor(G.max*0.4) + 1; }
function compatPairs(p){
  const out=[], seen=new Set();
  for(const m of p.mats) for(const c of p.chans){
    const k=m+'|'+c;
    if(!seen.has(k) && CHAN[c].cap>=MAT[m].tier){ seen.add(k); out.push({m,c}); }
  }
  return out;
}
function skillOf(p){ return p.ch.skill; }
function canSkill(p){
  const s=skillOf(p);
  if(s.cd!=null && p.cdLeft>0) return false;
  if(s.uses!=null && p.usesLeft<=0) return false;
  if(s.k==='charge' && p.charge) return false;
  if(s.k==='splash' && (p.funds<6 || p.mats.length>=3 || p.chans.length>=3)) return false;
  if(s.k==='rockets' && !others(p).length) return false;
  if(s.k==='dongsuan' && p.funds<3) return false;
  if(s.k==='sanda' || s.k==='blunt' || s.k==='table'){ if(!others(p).length) return false; }
  return true;
}
function skillStatus(p){
  const s=skillOf(p);
  if(s.cd!=null) return p.cdLeft>0 ? `冷卻 ${p.cdLeft} 回合` : '可使用';
  return p.usesLeft>0 ? `剩 ${p.usesLeft} 次` : '已用完';
}
function blockedRule(k){ return G.rule && G.round<=G.rule.until && G.rule.k===k; }
function onlyType(){ return G.only && G.only.r===G.round ? G.only.type : null; }
function onlyFor(p){ const t=onlyType(); return t && p.id!==G.only.by ? t : null; }

  const mk = (id,h) => { const c=charOf(id); return { id, name:c.name, ch:c, t:c.t, q:c.q, isHuman:h,
    votes: (h && SETUP.diff==='easy') ? 120 : 100, funds: 6 + (id==='W5'?10:0) + (h && SETUP.diff==='easy' ? 5 : 0) + (!h && SETUP.diff==='hard' ? 3 : 0) - (!h && SETUP.diff==='easy' ? 3 : 0), fr:FR_AMT[c.fr], frName:FR_NAME[c.fr],
    mats:[], chans:[], defs:[], alive:true, hate:{}, lastAttacker:null, usedMega:false,
    cdLeft:0, usesLeft:c.skill.uses||0, charge:null, stolen:0, streak:0, lastHitRound:-9, lastRallyRound:-9,
    noDefUntil:0, loans:[],
    pers:{ agg:c.agg, rev:c.rev, pref:c.pref, tgt:c.tgt, noDecay:!!c.noDecay } }; };
  G = { seed:seedStr, players:[mk(SETUP.char,true), ...rest.map(id=>mk(id,false))], pool:200, round:0, max:SETUP.rounds,
    pending:[], sympathy:[], flags:{}, lastEvent:null, recall:[], log:[], news:[], ticker:'', sel:{type:null},
    flash:new Set(), fx:[], rule:null, only:null, stats:{ big:null, hits:{}, rally:{}, dmg:{}, blocks:{}, sym:{}, fund:{}, backfire:{}, worst:{} }, diff:SETUP.diff,
    hs:{ launched:0, minVotes:100, blocks:0, hitsTaken:0, alarm:false, mega:false },

function say(L, text, o){ L.push(o&&o.k?{ k:o.k, t:text }:text); G.fx.push({ text, ...(o||{}) }); }

/* ===== 回合開始 ===== */
function startRound(){
  G.round++; G.flags={}; G.sel={type:null}; G.sel1=null; G.stage=1;
  const lines=[], tick=[];
  G.log.unshift({ r:G.round, lines });
  G.fx=[];
  if(R()<0.35){
    let ev, guard=0;
    do{ ev=weighted(EVENTS); guard++; } while(ev.k===G.lastEvent && guard<20);
    G.lastEvent=ev.k; applyEvent(ev,lines); tick.push(`【${ev.name}】${ev.desc}`);
  } else G.lastEvent=null;
  // 角色被動（回合開始）
  alive().forEach(p=>{
    if(p.id==='T10' && p!==leaderOf()){ p.votes+=2; }
    if(p.id==='T14' && p.votes<40){ p.votes+=2; lines.push(`台灣之子：${nm(p)}基本盤回流 +4 萬。`); }
    if(p.id==='W5'){
      addFunds(p,2);
      if(R()<0.15){ const oo=others(p); const t=leaderOf(G.diff==='easy'&&oo.some(o=>!o.isHuman)?oo.filter(o=>!o.isHuman):oo); if(t){ const l=loseVotes(t,3); ev(lines,'亂發文',`馬斯殼亂發文，${nm(t)}躺著中槍 -${l} 萬。`,{ a:p.id, t:t.id, amt:-l }); } }
    }
    if(p.id==='W4' && CONFIG.W4_VERSION==='xi' && R()<0.15){
      const t=pick(others(p).filter(x=>x.chans.length<3));
      if(t){ t.chans.push('pundit'); p.loans.push({ id:t.id, r:G.round+3 }); ev(lines,'一帶一路',`席大大借給${nm(t)}一個「名嘴」管道，3 回合後要收利息。`,{ a:p.id, t:t.id }); }
    }
    if(p.id==='W4'){ p.loans.filter(x=>x.r===G.round).forEach(x=>{ const t=P(x.id); if(t&&t.alive){ const amt=Math.min(3,t.funds); t.funds-=amt; addFunds(p,amt); ev(lines,'一帶一路收帳',`${nm(t)}付給席大大 ${amt} 獻金。`,{ a:p.id, t:t.id }); } }); p.loans=p.loans.filter(x=>x.r>G.round); }
    if(p.id==='W19' && G.round%5===0){ const t=pick(others(p)); if(t){ t.hate[p.id]=(t.hate[p.id]||0)+3; lines.push(`元老院：${nm(t)}開始記恨凱灑。`); } }
    if(p.id==='W22' && G.round>=lateStart() && R()<0.1){ const l=loseVotes(p,15); ev(lines,'本能寺之變',`${nm(p)}遭背叛 -${l} 萬。`,{ t:p.id, amt:-l }); }
  });
  G.sympathy.filter(x=>x.r===G.round).forEach(x=>{ const p=P(x.id); if(p.alive){ p.votes+=x.amt; ev(lines,'同情票回流',`${nm(p)}的同情票回來了，+${x.amt} 萬。`,{ t:p.id, amt:x.amt }); } });
  G.sympathy=G.sympathy.filter(x=>x.r>G.round);
  if(G.polls.includes(G.round)){
    const L=leaderOf();
    if(L){
      alive().forEach(p=>{ if(!p.isHuman && p!==L) p.hate[L.id]=(p.hate[L.id]||0)+2; });
      ev(lines,'民調公布',`${nm(L)}暫時領先，成為眾矢之的。`,{ a:L.id });
      tick.push(`【民調公布】${L.name} 領先`);
    }
  }
  if(onlyType()) { ev(lines,'書同文',`本回合除了${nm(P(G.only.by))}以外，全場只能「${ONLY[onlyType()]}」。`,{ a:G.only.by }); tick.push(`【書同文】全場只能${ONLY[onlyType()]}`); }
  if(G.rule && G.round<=G.rule.until) tick.push(`【修憲】${RULES[G.rule.k]}`);
  if(G.round===G.max){ ev(lines,'選前之夜','今晚造勢效果加倍！'); tick.push('【選前之夜】造勢效果 ×2'); }
  G.news.forEach(n=>tick.push(n));
  G.news=[];
  G.ticker = tick.length ? tick.join('　　') : '各陣營全力衝刺中，距離投票日還有 '+(G.max-G.round)+' 天';
  checkDeaths(lines);
  updateAlarms(lines);
  const startFx=G.fx.slice(); G.fx=[];
  if(checkEnd(false)) return;
  renderGame();
  playFx(startFx, ()=>{}, `第 ${G.round} 回合開始`);
}

function ev(L,head,text,o){ say(L,text,{ k:'event', head, ...(o||{}) }); }
function applyEvent(e,L){
  const a=alive();
  switch(e.k){
    case 'typhoon': G.flags.noRally=true; ev(L,e.name,'本回合所有造勢無效。'); break;
    case 'relief': { const p=pick(a); p.votes+=8; ev(L,e.name,`${nm(p)}救災表現亮眼 +8 萬。`,{ t:p.id, amt:8 }); break; }
    case 'egg': { const p=leaderOf(); const l=loseVotes(p,5); ev(L,e.name,`${nm(p)}被怪罪，-${l} 萬。`,{ t:p.id, amt:-l }); break; }
    case 'boba': a.forEach(p=>p.funds=Math.max(0,p.funds-2)); ev(L,e.name,'全員政治獻金 -2。'); break;
    case 'influencer': { const p=pick(a); G.flags.boost=p.id; ev(L,e.name,`${nm(p)}本回合造勢 ×2。`,{ a:p.id }); break; }
    case 'fake': G.flags.intMod=-0.2; ev(L,e.name,'本回合所有攔截率 -20%。'); break;
    case 'pundit': { let c=0; a.forEach(p=>{ const b=p.chans.length; p.chans=p.chans.filter(x=>x!=='pundit'); c+=b-p.chans.length; }); ev(L,e.name,`全場 ${c} 個「名嘴」管道失效。`); break; }
    case 'recall': { const p=pick(a); const l=loseVotes(p,10); G.recall.push({ id:p.id, r:G.round+1 }); ev(L,e.name,`${nm(p)} -${l} 萬，撐過下一回合可回 +5 萬。`,{ t:p.id, amt:-l }); break; }
    case 'turnout': G.pool=Math.max(0,G.pool-30); ev(L,e.name,'中間選民池 -30 萬。'); break;
    case 'swing': { const s=[...a].sort((x,y)=>x.votes-y.votes).slice(0,2); s.forEach(p=>p.votes+=6); ev(L,e.name,`${s.map(nm).join('、')}各 +6 萬。`,{ a:s[0]&&s[0].id, t:s[1]&&s[1].id, amt:6, pair:true }); break; }
  }
}

/* ===== AI ===== */
function targetable(p,opp){
  let c=opp.filter(o=>o.humbleRound!==G.round);
  c=c.filter(o=>!(o.table && o.table.id===p.id && G.round<=o.table.until));
  return c.length?c:opp;
}
function chooseTarget(p,opp){
  opp=targetable(p,opp);
  if(G.diff==='easy'){ if(R()<0.5) return pick(opp); const hu=opp.find(o=>o.isHuman), ai=opp.filter(o=>!o.isHuman); if(hu && ai.length){ if(R()<1/opp.length) return hu; opp=ai; } }
  if(G.diff==='hard'){ const lead=leaderOf(opp); if(lead && lead.isHuman && R()<0.5) return lead; }
  let hk=null, hv=0;
  for(const o of opp){ const h=p.hate[o.id]||0; if(h>hv){ hv=h; hk=o; } }
  if(hk && hv>=5 && G.diff!=='easy' && R()<0.5+p.pers.rev*0.1) return hk;
  switch(p.pers.tgt){
    case 'leader': return maxBy(opp,o=>o.votes);
    case 'weakest': return minBy(opp,o=>o.votes);
    case 'strongest': return maxBy(opp,o=>o.funds+o.mats.length*4+o.chans.length*3+o.votes*0.1);
    case 'recent': { const la=opp.find(o=>o.id===p.lastAttacker); return la || maxBy(opp,o=>o.votes); }
    default: return pick(opp);
  }
}
function defOptions(p){ return Object.keys(DEF).filter(k=>defCost(p,k)<=p.funds && !(k==='divert'&&tr(p).noDivert)); }
function bestDef(p){
  const opts=defOptions(p).sort((a,b)=>DEF[b].cost-DEF[a].cost);
  if(!opts.length) return null;
  return R()<0.6 ? opts[0] : pick(opts);
}
function aiAcquire(p, forced){
  const maxTier = p.mats.length ? Math.max(...p.mats.map(m=>MAT[m].tier)) : 1;
  const caps = p.chans.map(c=>CHAN[c].cap);
  const needChan = p.mats.some(m=>!caps.some(cap=>cap>=MAT[m].tier));
  if(forced!=='mat' && (needChan || p.mats.length>p.chans.length || forced==='chan') && p.chans.length<3){
    const opts=Object.keys(CHAN).filter(c=>chanCost(p,c)<=p.funds && CHAN[c].cap>=maxTier);
    if(opts.length) return { type:'chan', item:pick(opts) };
  }
  if(forced!=='chan' && p.mats.length<3){
    const opts=Object.keys(MAT).filter(m=>matCost(p,m)<=p.funds && !(m==='m'&&p.usedMega)).sort((a,b)=>MAT[b].tier-MAT[a].tier);
    if(opts.length) return { type:'mat', item: (G.diff==='hard' && G.round>=G.max-4) || R()<0.3+p.pers.agg*0.1 ? opts[0] : pick(opts) };
  }
  if(forced!=='mat' && p.chans.length<3){
    const opts=Object.keys(CHAN).filter(c=>chanCost(p,c)<=p.funds);
    if(opts.length) return { type:'chan', item:pick(opts) };
  }
  return null;
}
function aiRallyTarget(p,opp){
  if(p.id==='W4' && CONFIG.W4_VERSION==='mao' && p.funds>=3 && opp.length>=2 && R()<0.35) return 'redbook';
  if(p.id==='W4' && CONFIG.W4_VERSION==='mao') return (p.stolen>=30 ? leaderOf(opp) : lowestOf(opp)).id;
  if(tr(p).poolAdd>0 || tr(p).poolMult) { if(G.pool>0 && R()<0.55) return 'pool'; }
  return (R()<0.3&&G.pool>0)?'pool':chooseTarget(p,opp).id;
}
function aiSkill(p,opp){
  if(!canSkill(p)) return null;
  if(G.diff==='easy' && R()<0.6) return null;
  const s=skillOf(p), threat=opp.some(o=>o.mats.some(m=>MAT[m].tier>=3));
  const me=p, lead=leaderOf(opp);
  let use=false, extra={};
  switch(s.k){
    case 'calm': case 'humble': use=threat && R()<0.5; break;
    case 'cash': use=(p.funds<10 || G.pool>=20) && R()<0.45; break;
    case 'blunt': { const t=chooseTarget(p,opp); use=p.votes>=40 && t.votes>=30 && R()<0.45; extra.target=t.id; break; }
    case 'charge': use=G.round<=G.max-3 && R()<0.35; break;
    case 'amend': use=R()<0.2; extra.rule = (leaderOf()===me) ? 'noatk' : pick(['nodef','norally']); break;
    case 'dongsuan': { const t=chooseTarget(p,opp); use=!G.flags.noRally && !blockedRule('norally') && R()<0.45; extra.target=t.id; break; }
    case 'tariff': use=R()<0.45; break;
    case 'rockets': use=opp.length>=2 && R()<0.55; break;
    case 'table': { const la=opp.find(o=>o.id===p.lastAttacker); use=!!la && R()<0.6; if(la) extra.target=la.id; break; }
    case 'united': use=lead && lead.votes>=me.votes && R()<0.4; break;
    case 'leap': use=p.funds>=7 && R()<0.35; break;
    case 'splash': use=R()<0.6; break;
    case 'unify': use=R()<0.4; extra.only = (compatPairs(p).length || threat) ? 'fundraise' : pick(['fundraise','defend']); break;
    case 'west': use=compatPairs(p).length>0 && R()<0.6; break;
    case 'rubicon': use=(compatPairs(p).length>=2 || G.round>=G.max-1) && R()<0.6; extra.double = compatPairs(p).length>=2 ? 'launch' : 'rally'; break;
    case 'sanda': { const t=chooseTarget(p,opp); use=R()<0.5; extra.target=t.id; break; }
  }
  if(!use) return null;
  if(s.k==='rubicon'){
    const base = extra.double==='launch' ? aiLaunch(p,opp) : { type:'rally', target:aiRallyTarget(p,opp) };
    if(!base) return null;
    return { ...base, double:true };
  }
  return { type:'skill', ...extra };
}
function aiLaunch(p,opp){
  let pairs=compatPairs(p);
  if(G.round===G.max) pairs=pairs.filter(x=>!CHAN[x.c].delay);
  if(!pairs.length) return null;
  pairs.sort((x,y)=>MAT[y.m].tier-MAT[x.m].tier);
  return { type:'launch', mat:pairs[0].m, chan:pairs[0].c, target:chooseTarget(p,opp).id };
}
function aiDecide(p){
  const opp=others(p);
  if(!opp.length) return { type:'fundraise' };
  const pe=p.pers, last=G.round===G.max, only=onlyFor(p);
  if(only){
    if(only==='rally') return (p.funds>=rallyCost(p)) ? { type:'rally', target:aiRallyTarget(p,opp) } : { type:'fundraise' };
    if(only==='fundraise') return { type:'fundraise' };
    if(only==='defend'){ const d=p.defs.length<defLimit(p)&&bestDef(p); return d?{ type:'defend', item:d }:{ type:'fundraise' }; }
    const a=aiAcquire(p,only); return a||{ type:'fundraise' };
  }
  const sk=aiSkill(p,opp); if(sk) return sk;
  const L0=aiLaunch(p,opp);
  const dAdj = G.diff==='easy' ? -0.25 : G.diff==='hard' ? 0.10 : 0;
  if(L0 && !blockedRule('noatk') && (last || R()<0.45+pe.agg*0.12+dAdj)) return L0;
  if(p.funds<3) return { type:'fundraise' };
  const threat=opp.some(o=>o.mats.some(m=>MAT[m].tier>=3));
  const canDef = p.defs.length<defLimit(p) && G.round>=p.noDefUntil && !blockedRule('nodef');
  if(threat && canDef && R()<(0.3+(pe.pref==='defend'?0.3:0))*(G.diff==='easy'?0.5:1)){ const d=bestDef(p); if(d) return { type:'defend', item:d }; }
  const w={ rally:2, acquire:2+pe.agg*0.4, defend:0.5, fundraise: p.funds<6 ? 2.5 : 0.8 };
  if(pe.pref==='rally') w.rally+=2;
  if(pe.pref==='attack') w.acquire+=1.5;
  if(pe.pref==='defend') w.defend+=1.5;
  if(pe.pref==='acquire') w.acquire+=2;
  if(G.flags.noRally || blockedRule('norally') || p.funds<rallyCost(p)) w.rally=0;
  if(!canDef) w.defend=0;
  if(last){ w.rally+=4; w.acquire=0; w.defend=0; }
  const k=weightedKey(w);
  if(k==='rally') return { type:'rally', target:aiRallyTarget(p,opp), tip: tr(p).tipOption && p.funds>=rallyCost(p)+4 };
  if(k==='defend'){ const d=bestDef(p); if(d) return { type:'defend', item:d }; }
  if(k==='acquire'){ const a=aiAcquire(p); if(a) return a; }
  if(p.funds>=rallyCost(p) && !G.flags.noRally && !blockedRule('norally')) return { type:'rally', target:aiRallyTarget(p,opp) };
  return { type:'fundraise' };
}

/* ===== 結算 ===== */
function applyDamage(a,target,raw,L,label){
  let dmg=raw*(tr(target).takenMult||1);
  if(target.calmRound===G.round) dmg*=0.5;
  const lost=loseVotes(target,dmg);
  const swing=Math.floor(lost/2); a.votes+=swing; G.pool=Math.max(0,G.pool-Math.floor(lost/2)); // 被爆料流失的票：一半轉向爆料者，一半流失
  if(target.charge){ target.charge.hits++; if(target.charge.hits>=2){ target.charge=null; say(L,`${nm(target)}的反攻大陸被打斷了！`,{ a:target.id }); } }
  target.hate[a.id]=(target.hate[a.id]||0)+lost/2*target.pers.rev/3;
  target.lastAttacker=a.id;
  G.flash.add(target.id);
  G.stats.hits[target.id]=(G.stats.hits[target.id]||0)+1;
  G.stats.dmg[a.id]=(G.stats.dmg[a.id]||0)+lost;
  if(!G.stats.big || lost>G.stats.big.dmg) G.stats.big={ dmg:lost, a:a.id, t:target.id, m:label };
  return lost;
}
function humbleBlock(a,t,what,L){
  if(t && t.humbleRound===G.round && !a.inSkill){ say(L,`${nm(t)}溫良恭儉讓，${nm(a)}不好意思對他${what}。`,{ a:a.id, t:t.id, k:'block' }); return true; }
  return false;
}
function hit(a,t,mk,ck,L,share){
  const M=MAT[mk], C=CHAN[ck];
  if(!a || !a.alive) return;
  if(blockedRule('noatk')){ say(L,`修憲禁止爆料，${nm(a)}的${M.name}被擋在門外。`,{ a:a.id }); return; }
  if(!t || !t.alive){ say(L,`${nm(a)}的${M.name}打空了，目標已退場。`,{ a:a.id }); return; }
  let target=t;
  if(a.id==='W2' && R()<0.15){ const c=others(a); if(c.length){ const nt=pick(c); if(nt!==target){ say(L,`金正嗯試射偏了，改打到${nm(nt)}！`,{ a:a.id, t:nt.id }); target=nt; } } }
  if(humbleBlock(a,target,'爆料',L)) return;
  if(target.table && target.table.id===a.id && G.round<=target.table.until){ say(L,`長桌會議：${nm(a)}被隔在長桌另一端，打不到${nm(target)}。`,{ a:a.id, t:target.id, k:'block' }); return; }
  if(!a.isHuman && R()<0.4 && !share) L.push(`${a.name}：「${a.q}」`);
  if(tr(target).baseBlock && R()<tr(target).baseBlock){ say(L,`萬里長城擋下了${nm(a)}的${M.name}。`,{ a:a.id, t:target.id, k:'block', icon:'盾' }); return; }
  const chanMod = tr(a).forceLive ? -0.2 : C.mod;
  if(target.defs.length && !blockedRule('nodef')){
    const dk=target.defs[0], D=DEF[dk];
    const pr=Math.max(0,Math.min(0.85,D.p+chanMod+(G.flags.intMod||0)+(tr(target).intMod||0)+(tr(a).atkIntMod||0)+((tr(target).defBias||{})[dk]||0)));
    const keep = tr(target).defKeep && R()<tr(target).defKeep;
    if(!keep) target.defs.shift();
    if(R()<pr){
      if(target.isHuman) G.hs.blocks++;
      G.stats.blocks[target.id]=(G.stats.blocks[target.id]||0)+1;
      if(tr(target).defOkFunds) addFunds(target,tr(target).defOkFunds);
      if(tr(target).defOkReveal){ L.push(`照亮真相：${nm(a)}的庫存是 素材［${a.mats.map(k=>MAT[k].name).join('、')||'無'}］、管道［${a.chans.map(k=>CHAN[k].name).join('、')||'無'}］。`); }
      if(dk==='divert'){
        const c=alive().filter(x=>x!==a && x!==target);
        if(!c.length){ say(L,`${nm(target)}轉移焦點，${nm(a)}的${M.name}不了了之。`,{ a:a.id, t:target.id, k:'block' }); return; }
        const nt = tr(target).divertLowest ? lowestOf(c) : pick(c);
        const w=why('divert',a,target);
        say(L,`${w}！${nm(a)}的${M.name}改打到${nm(nt)}身上。`,{ a:a.id, t:nt.id, k:'block', news:`轉移焦點：${w}` });
        target=nt;
        if(humbleBlock(a,target,'爆料',L)) return;
      } else if(dk==='clarify'){
        const w=why('clarify',a,target);
        say(L,`${nm(target)}召開澄清記者會，擋下了${nm(a)}的${M.name}。`,{ a:a.id, t:target.id, k:'block', news:`澄清：${w}` }); return;
      } else {
        const l=loseVotes(a,tr(target).sueCounter||5);
        const w=why('sue',a,target);
        say(L,`${nm(target)}提告成功，擋下${nm(a)}的${M.name}，對方反扣 ${l} 萬。`,{ a:target.id, t:a.id, k:'block', amt:-l, news:`提告：${w}` }); return;
      }
    } else {
      L.push(`${nm(target)}的${D.name}沒擋住！`);
      if(tr(target).defFailCounter){ const l=loseVotes(a,tr(target).defFailCounter); L.push(`${nm(target)}直接嗆回去，${nm(a)} -${l} 萬。`); }
    }
  }
  let mult=C.mult*(tr(a).dmgMult||1)*(((tr(a).matDmg||{})[mk])||1)*(((tr(a).chanDmg||{})[ck])||1);
  if(tr(a).dmgVsRecent && a.lastAttacker===target.id) mult*=tr(a).dmgVsRecent;
  if(a.westUntil && G.round<=a.westUntil) mult*=1.3;
  if(a.id==='W22' && !a.inSkill) mult*= G.round<=earlyCut() ? 1.25 : 0.9;
  if(a.id==='W19' && a.streak>=2 && a.lastHitRound===G.round-1) mult*=1.5;
  if(a.alarm==='boost') mult*=1.5;
  if(a.rocket) mult*=1.4;
  if(share) mult*=share;
  const lost=applyDamage(a,target,ri(M.min,M.max)*mult,L,M.name);
  const gossip=draw('gossip',GOSSIP).replace('{n}',target.name);
  say(L,`${nm(a)}透過${C.name}發動「${M.name}」：${gossip}！${nm(target)} -${lost} 萬，${nm(a)}吸走 ${Math.floor(lost/2)} 萬。`,{ k:'hit', a:a.id, t:target.id, amt:-lost, head:M.head, news:`${M.head}：${gossip}` });
  G.news.push(`${M.head}：${gossip}`);
  if(G.stats.big && G.stats.big.t===target.id && G.stats.big.a===a.id && G.stats.big.dmg===lost) G.stats.big.news=`${M.head}：${gossip}`;
  if(a.lastHitRound!==G.round){ a.streak = a.lastHitRound===G.round-1 ? a.streak+1 : 1; a.lastHitRound=G.round; }
  if(tr(a).onHitSelf){ a.votes+=tr(a).onHitSelf; }
  if(target.id==='W1' && R()<0.2){ target.votes+=5; L.push('黑紅也是紅：川不普被爆料反而 +5 萬。'); }
  if(tr(target).refund && R()<tr(target).refund){ const back=Math.round(lost/2); target.votes+=back; L.push(`悲情牌奏效：${nm(target)}回補 ${back} 萬。`); }
  if(M.splash && !share){
    alive().filter(x=>x!==a && x!==target).forEach(x=>loseVotes(x,M.splash));
    L.push(`輿論風暴波及全場，其他人各 -${M.splash} 萬。`);
  }
  const bl=a.noBacklash?0:(M.tier===4?0.3:0.15)*(tr(a).backlashMult||1);
  if(R()<bl){ G.stats.backfire[a.id]=(G.stats.backfire[a.id]||0)+1; const l=loseVotes(a,3); L.push(`負面選戰反噬：${nm(a)} -${l} 萬。`); }
  if(!a.inSkill) target.rLost=(target.rLost||0)+lost;
  if(target.isHuman) G.hs.hitsTaken++;
  if(a.isHuman && M.tier===4) G.hs.mega=true;
  if(a.id==='W18' && !share){
    const c=alive().filter(x=>x!==a && x!==target);
    if(c.length){ const t2=pick(c); L.push('鐵騎兵分二路！'); hit(a,t2,mk,ck,L,0.8); }
  }
}
function rallyQuote(p){ return R()<0.75 ? draw('q'+p.id, p.ch.lines) : ''; }
function doRally(p,a,L){
  const cost = a.target==='redbook' ? 3-boostOff(p) : rallyCost(p) + (a.tip && tr(p).tipOption ? 2 : 0);
  if(!p.alive || p.funds<cost) return;
  p.funds-=cost;
  if(G.flags.noRally || blockedRule('norally')){ say(L,`${nm(p)}的造勢${G.flags.noRally?'被颱風假爭議蓋過':'被修憲禁止'}，沒有效果。`,{ a:p.id }); return; }
  let mult=1;
  if(G.flags.boost===p.id) mult*=2;
  if(G.round===G.max) mult*=2;
  if(a.tip && tr(p).tipOption) mult*=1.5;
  if(p.alarm==='boost') mult*=1.5;
  if(p.id==='T2' && R()<0.2){ mult*=2; L.push('貓咪加持！造勢效果加倍。'); }
  if(p.id==='T4'){ if(R()<0.25){ say(L,`${nm(p)}的發大財造勢落空了。`,{ a:p.id }); return; } mult*=1.5; }
  let bonus = (tr(p).rallyAdd||0) - (G.diff==='easy' && !p.isHuman ? 1 : 0);
  if(tr(p).streakRally && p.lastRallyRound===G.round-1) bonus+=tr(p).streakRally;
  p.lastRallyRound=G.round;
  const base = () => tr(p).rallyFixed ? tr(p).rallyFixed : null;
  if(a.target==='redbook'){
    const ts=shuffle(others(p).filter(o=>o.humbleRound!==G.round)).slice(0,3); let sum=0;
    ts.forEach(t=>{ const g=Math.min(t.votes,Math.round(2*mult)); t.votes-=g; sum+=g; t.hate[p.id]=(t.hate[p.id]||0)+1; });
    p.votes+=sum; p.stolen+=sum;
    say(L,`${nm(p)}發放小紅書，從${ts.map(nm).join('、')}身上共挖走 ${sum} 萬。`,{ a:p.id, amt:sum, k:'rally' });
    G.stats.rally[p.id]=(G.stats.rally[p.id]||0)+sum; return;
  }
  let g;
  if(a.target==='pool'){
    let v=(base() ?? ri(2,4)) + bonus + (tr(p).poolAdd||0);
    v*= (tr(p).poolMult||1);
    g=Math.min(G.pool, Math.max(1,Math.round(v*mult))); G.pool-=g; p.votes+=g;
    const qt=rallyQuote(p); say(L,`${nm(p)}向中間選民造勢，+${g} 萬。${qt?`「${qt}」`:''}`,{ a:p.id, amt:g, k:'rally', quote:qt });
  } else {
    const t=P(a.target);
    if(!t || !t.alive){ say(L,`${nm(p)}的造勢目標已退場。`,{ a:p.id }); return; }
    if(t.humbleRound===G.round && !p.inSkill){ say(L,`${nm(t)}溫良恭儉讓，${nm(p)}不好意思去他的地盤挖票。`,{ a:p.id, t:t.id, k:'block' }); return; }
    const opp=others(p);
    let v=(base() ?? ri(2,6)) + bonus + (tr(p).stealAdd||0);
    if(tr(p).vsLeaderAdd && t===leaderOf(opp)) v+=tr(p).vsLeaderAdd;
    if(tr(p).vsLowestAdd && t===lowestOf(opp)) v+=tr(p).vsLowestAdd;
    if(p.id==='W4' && CONFIG.W4_VERSION==='mao' && p.stolen>=30 && t===leaderOf(opp)) mult*=2;
    g=Math.min(t.votes, Math.max(1,Math.round(v*mult))); t.votes-=g; p.votes+=g; p.stolen+=g;
    t.hate[p.id]=(t.hate[p.id]||0)+1;
    const qt=rallyQuote(p); say(L,`${nm(p)}到${t.isHuman?'你':t.name}的地盤造勢，挖走 ${g} 萬。${qt?`「${qt}」`:''}`,{ a:p.id, t:t.id, amt:g, k:'rally', quote:qt });
  }
  G.stats.rally[p.id]=(G.stats.rally[p.id]||0)+g;
}
function doSkill(p,a,L){ p.inSkill=true; try{ doSkillInner(p,a,L); } finally { p.inSkill=false; } }
function doSkillInner(p,a,L){
  const s=skillOf(p); if(!canSkill(p)) return;
  if(p.isHuman && ['blunt','tariff','sanda','rockets','charge'].includes(s.k)) G.hs.launched++;
  if(s.cd!=null) p.cdLeft=s.cd+1; else p.usesLeft--;
  const opp=others(p);
  const T = a.target ? P(a.target) : null;
  switch(s.k){
    case 'calm': p.calmRound=G.round; say(L,`${nm(p)}發動「冷靜回應」，本回合爆料傷害減半。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'humble': p.humbleRound=G.round; say(L,`${nm(p)}發動「溫良恭儉讓」，對手不好意思對他出手。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'cash': { G.stats.fund[p.id]=(G.stats.fund[p.id]||0)+3; addFunds(p,3); let g=0; if(!G.flags.noRally && !blockedRule('norally')){ g=Math.min(G.pool,5); G.pool-=g; p.votes+=g; }
      say(L,`${nm(p)}：「貨出得去，人進得來！」拉到 ${g} 萬票、獻金 +3。`,{ a:p.id, k:'skill', skill:s.name, amt:g, quote:'貨出得去，人進得來，選票發大財！' }); break; }
    case 'blunt': if(T&&T.alive){ const l=applyDamage(p,T,25,L,s.name); const s2=loseVotes(p,3); say(L,`${nm(p)}「直白發言」，${nm(T)} -${l} 萬，自己也 -${s2} 萬。`,{ a:p.id, t:T.id, amt:-l, k:'hit', head:s.name }); } break;
    case 'charge': p.charge={ fire:G.round+3, hits:0 }; say(L,`${nm(p)}宣告「反攻大陸」！蓄力 3 回合，其間被命中 2 次就會中斷。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'amend': G.rule={ k:a.rule||'noatk', until:G.round+1 }; say(L,`${nm(p)}「修憲」：本回合與下回合${RULES[G.rule.k]}。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'dongsuan': {
      if(T&&T.alive){ doRally(p,{ target:T.id },L); p.funds+=rallyCost(p); }
      let rest=others(p).filter(x=>x!==T); if(G.diff==='easy' && !p.isHuman && rest.some(o=>!o.isHuman)) rest=rest.filter(o=>!o.isHuman); if(rest.length){ doRally(p,{ target:leaderOf(rest).id },L); p.funds+=rallyCost(p); }
      p.funds=Math.max(0,p.funds-4); break; }
    case 'tariff': { const hitList=[]; opp.forEach(o=>{ const l=applyDamage(p,o,6,L,s.name); hitList.push(`${nm(o)} -${l}`); }); loseVotes(p,3); alive().forEach(x=>x.funds=Math.max(0,x.funds-1));
      say(L,`${nm(p)}揮出「關稅大棒」：${hitList.join('、')} 萬，自己 -3 萬，全員獻金 -1。`,{ a:p.id, k:'hit', head:s.name, amt:-6 }); break; }
    case 'rockets': { const ts=shuffle(others(p).slice()).slice(0,Math.ceil(others(p).length/2)); say(L,`${nm(p)}點燃「沖天炮齊射」！${ts.map(nm).join('、')}被瞄準了。`,{ a:p.id, k:'skill', skill:s.name }); p.noBacklash=true; p.rocket=true; ts.forEach(o=>hit(p,o,'s','explainer',L)); p.noBacklash=false; p.rocket=false; break; }
    case 'table': if(T){ p.table={ id:T.id, until:G.round+1 }; say(L,`${nm(p)}召開長桌會議，${nm(T)}本回合與下回合碰不到他。`,{ a:p.id, t:T.id, k:'skill', skill:s.name }); } break;
    case 'united': { const t=leaderOf(G.diff==='easy'&&opp.some(o=>!o.isHuman)?opp.filter(o=>!o.isHuman):opp); if(t){ const g=Math.min(8,t.votes); t.votes-=g; p.votes+=g; G.stats.rally[p.id]=(G.stats.rally[p.id]||0)+g; t.hate[p.id]=(t.hate[p.id]||0)+2; say(L,`${nm(p)}發動「統戰」，從${nm(t)}身上挖走 ${g} 萬。`,{ a:p.id, t:t.id, amt:g, k:'rally' }); } break; }
    case 'leap': p.leapRound=G.round+1; say(L,`${nm(p)}宣布「大躍進」，下回合取得量 ×3……如果成功的話。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'splash': p.funds-=6; p.mats.push('v'); p.chans.push('live'); say(L,`${nm(p)}「砸錢」，直接買下爆料影片和直播。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'unify': G.only={ type:a.only||'rally', r:G.round+1, by:p.id }; say(L,`${nm(p)}「書同文」：下回合除了他自己，全場只能「${ONLY[G.only.type]}」。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'west': p.westUntil=G.round+1; say(L,`${nm(p)}宣布「西征」，本回合與下回合爆料傷害 +30%。`,{ a:p.id, k:'skill', skill:s.name }); break;
    case 'sanda': if(T&&T.alive){ say(L,`${nm(p)}「三段擊」！`,{ a:p.id, t:T.id, k:'skill', skill:s.name }); for(let i=0;i<3;i++) hit(p,T,'s','explainer',L); } break;
  }
}
function doAcquire(p,a,L,quiet){
  if(a.type==='fundraise'){ G.stats.fund[p.id]=(G.stats.fund[p.id]||0)+p.fr; addFunds(p,p.fr); p.isHuman ? say(L,`你募款，獻金 +${p.fr}。`) : quiet.push(`${p.name}募款`); return; }
  const isMat=a.type==='mat';
  const D=isMat?MAT[a.item]:CHAN[a.item]; if(!D) return;
  const cost=isMat?matCost(p,a.item):chanCost(p,a.item);
  const inv=isMat?p.mats:p.chans;
  if(p.funds<cost || inv.length>=3 || (isMat && a.item==='m' && p.usedMega)) return;
  p.funds-=cost;
  let n=1;
  if(p.leapRound===G.round){ if(R()<0.5){ n=3; say(L,`大躍進成功！${nm(p)}一口氣取得 3 份。`,{ a:p.id, k:'skill', skill:'大躍進' }); } else { const l=loseVotes(p,10); say(L,`大躍進失敗，${nm(p)}什麼都沒拿到，還 -${l} 萬。`,{ a:p.id, amt:-l, k:'hit', head:'大躍進' }); return; } }
  for(let i=0;i<n && inv.length<3;i++){ inv.push(a.item); if(isMat && a.item==='m'){ p.usedMega=true; break; } }
  if(p.isHuman) say(L, isMat?`你取得「${D.name}」。`:`你找到管道「${D.name}」。`);
  else quiet.push(isMat?`${p.name}備了料`:`${p.name}找了管道`);
}

function resolveRound(){
  const me=human();
  const acts=[];
  // 先處理影響 AI 選目標的技能（溫良恭儉讓）
  if([G.sel,G.sel1].some(x=>x&&x.type==='skill') && skillOf(me).k==='humble' && canSkill(me)) me.humbleRound=G.round;
  const aiActs=[];
  alive().filter(p=>!p.isHuman).forEach(p=>{ const a1=aiDecide(p); aiActs.push({ pid:p.id, ...a1 });
    if(p.alarm==='double'){ let a2=aiDecide(p); if(a2.type==='skill' || a2.double) a2={ type:'fundraise' }; aiActs.push({ pid:p.id, ...a2 }); } });
  if(G.sel1) acts.push({ pid:me.id, ...G.sel1 });
  acts.push({ pid:me.id, ...G.sel }, ...aiActs);
  // 盧比孔河：行動執行兩次
  const expanded=[];
  acts.forEach(a=>{ expanded.push(a); if(a.double){ const p=P(a.pid); if(p.id==='W19' && canSkill(p)){ p.usesLeft--; p.noDefUntil=G.round+3; expanded.push({ ...a, double:false, rubicon2:true }); } } });
  const L=G.log[0].lines;
  G.flash=new Set();
  const quiet=[];
  G.players.forEach(p=>{ p.rsVotes=p.votes; p.rLost=0; });
  expanded.filter(a=>a.rubicon2).forEach(a=>say(L,`${nm(P(a.pid))}渡過盧比孔河！本回合行動兩次。`,{ a:a.pid, k:'skill', skill:'渡過盧比孔河' }));

  // 0. 技能
  const DEF_SK=['calm','humble','table'];
  const skActs=expanded.filter(a=>a.type==='skill');
  skActs.filter(a=>DEF_SK.includes(skillOf(P(a.pid)).k)).forEach(a=>{ const p=P(a.pid); if(p.alive) doSkill(p,a,L); });
  skActs.filter(a=>!DEF_SK.includes(skillOf(P(a.pid)).k)).forEach(a=>{ const p=P(a.pid); if(p.alive) doSkill(p,a,L); });
  // 1. 防禦
  expanded.filter(a=>a.type==='defend').forEach(a=>{
    const p=P(a.pid), D=DEF[a.item];
    if(!p.alive || !D) return;
    if(a.item==='divert' && tr(p).noDivert) return;
    if(G.round<p.noDefUntil){ say(L,`${nm(p)}渡河之後無暇防禦。`); return; }
    const c=defCost(p,a.item);
    if(p.defs.length<defLimit(p) && p.funds>=c){
      p.funds-=c; p.defs.push(a.item);
      say(L, p.isHuman ? `你部署了「${D.name}」。` : `${p.name}部署了一項防禦。`,{ a:p.id, k:'def' });
    }
  });
  // 2. 造勢
  expanded.filter(a=>a.type==='rally').forEach(a=>doRally(P(a.pid),a,L));
  // 3. 爆料
  const due=G.pending.filter(x=>x.r===G.round);
  G.pending=G.pending.filter(x=>x.r!==G.round);
  due.forEach(x=>{ L.push('深夜政論節目播出了：'); hit(P(x.a),P(x.t),x.m,x.c,L); });
  expanded.filter(a=>a.type==='launch').forEach(a=>{
    const p=P(a.pid);
    if(!p.alive) return;
    const mi=p.mats.indexOf(a.mat), ci=p.chans.indexOf(a.chan);
    if(mi<0 || ci<0 || CHAN[a.chan].cap<MAT[a.mat].tier){ if(p.isHuman) L.push('你的素材或管道已失效，爆料沒有發出。'); return; }
    if(blockedRule('noatk')){ say(L,`修憲禁止爆料，${nm(p)}只好把料收起來。`,{ a:p.id }); return; }
    p.mats.splice(mi,1); p.chans.splice(ci,1);
    if(p.isHuman) G.hs.launched++;
    if(CHAN[a.chan].delay){
      G.pending.push({ a:p.id, t:a.target, m:a.mat, c:a.chan, r:G.round+1 });
      say(L,`${nm(p)}把一份料交給深夜政論節目，明天見報。`,{ a:p.id });
    } else hit(p,P(a.target),a.mat,a.chan,L);
  });
  // 反攻大陸
  alive().forEach(p=>{ if(p.charge && G.round>=p.charge.fire){ p.charge=null; const parts=[]; others(p).forEach(o=>{ const l=applyDamage(p,o,20,L,'反攻大陸'); parts.push(`${nm(o)} -${l}`); }); say(L,`反攻大陸成功！${parts.join('、')} 萬。`,{ a:p.id, k:'hit', head:'反攻大陸', amt:-20 }); } });
  // 4. 取得／募款
  expanded.filter(a=>['fundraise','mat','chan'].includes(a.type)).forEach(a=>{ const p=P(a.pid); if(p.alive) doAcquire(p,a,L,quiet); });
  if(quiet.length) L.push(`幕後動作：${quiet.join('、')}。`);

  settleSympathy(L);
  G.recall.filter(x=>x.r===G.round).forEach(x=>{ const p=P(x.id); if(p.alive && p.votes>0){ p.votes+=5; ev(L,'撐過罷免',`${nm(p)}撐過罷免，回 +5 萬。`,{ t:p.id, amt:5 }); } });
  G.recall=G.recall.filter(x=>x.r>G.round);

  checkDeaths(L);
  alive().forEach(p=>{
    addFunds(p,1+Math.floor(p.votes/50));
    if(p.cdLeft>0) p.cdLeft--;
    if(!p.pers.noDecay) for(const k in p.hate) p.hate[k]*=0.9;
  });
  { const me2=human(); G.hs.minVotes=Math.min(G.hs.minVotes, me2.votes); if(me2.alarm) G.hs.alarm=true; }
  [...G.players].sort((x,y)=>(y.alive-x.alive)||(y.votes-x.votes)).forEach((p,i)=>{ G.stats.worst[p.id]=Math.max(G.stats.worst[p.id]||0,i+1); });
  const final = G.round>=G.max;
  playFx(G.fx.slice(), ()=>{ if(checkEnd(final)) return; startRound(); });
}

function settleSympathy(L){
  const al=[...alive()].filter(p=>p.votes>0).sort((x,y)=>y.votes-x.votes);
  const n=al.length; if(n<2) return;
  al.forEach((p,i)=>{
    if(i===0 || !p.rLost || p.rLost<=0.25*p.rsVotes) return;
    const pos=i/(n-1), lo=0.10+0.30*pos, ratio=lo+R()*0.10;
    const back=Math.max(1,Math.round(p.rLost*ratio));
    G.sympathy.push({ id:p.id, amt:back, r:G.round+1 });
    G.stats.sym[p.id]=(G.stats.sym[p.id]||0)+back;
    L.push(`${nm(p)}這回合被爆掉 ${p.rLost} 萬，超過自身票數的 1/4，選民同情，下回合將回流 ${back} 萬（目前第 ${i+1} 名，回流 ${Math.round(ratio*100)}%）。`);
  });
}
function checkDeaths(L){
  G.players.forEach(p=>{
    if(p.alive && p.votes<=0){
      p.alive=false; p.votes=0; p.mats=[]; p.chans=[]; p.defs=[]; p.charge=null;
      if(G.fx) G.fx.push({ text:`${nm(p)}凍蒜失敗，退出選戰。`, t:p.id, k:'out' });
      L.push({ k:'out', t:`${nm(p)}凍蒜失敗，退出選戰。` });
    }
  });
}
function checkEnd(final){
  const al=alive(), me=human();
  if(al.length===0){ renderEnd('none'); return true; }
  if(!me.alive){ renderEnd('lost'); return true; }
  if(al.length===1){ renderEnd('solo'); return true; }
  if(final){ renderEnd('vote'); return true; }
  return false;
}

/* ===== 結算動畫 ===== */
let fxTimer=null;
function playFx(list, done, label){
  const box=$('#fx');
  const items=list.filter(x=>(x.a||x.t||x.k==='event') && x.k!=='def');
  if(!items.length || typeof window.matchMedia!=='function'){ box.innerHTML=''; done(); return; }
  let i=0;
  const finish=()=>{ clearTimeout(fxTimer); box.innerHTML=''; done(); };
  const show=()=>{
    clearTimeout(fxTimer);
    if(i>=items.length){ finish(); return; }
    const x=items[i], A=x.a?P(x.a):null, T=x.t?P(x.t):null;
    const head = x.k==='hit' ? `號外｜${x.head||'爆料'}` : x.k==='rally' ? '造勢現場' : x.k==='block' ? '防禦成功' : x.k==='skill' ? `技能｜${x.skill||''}` : x.k==='out' ? '凍蒜失敗' : x.k==='event' ? `號外｜${x.head}` : '最新消息';
    const side=(p,cls,mood)=>p?`<div class="fx-side"><img class="art ${cls}" src="${art(p.id,mood)}" alt=""><span>${esc(nm(p))}</span></div>`:'';
    const amt = x.amt!=null ? `<div class="fx-amt ${x.amt<0?'loss':'gain'}">${x.amt>0?'+':''}${x.amt} 萬</div>` : '';
    let stage;
    if(A && T && A!==T) stage = x.pair ? `<div class="fx-stage">${side(A,'a','happy')}<div class="fx-arrow">＆</div>${side(T,'a','happy')}</div>` : `<div class="fx-stage">${side(A,'a','happy')}<div class="fx-arrow">${x.k==='rally'?'⇠':'⇢'}</div>${side(T,'t',T.alive?'sweat':'down')}</div>`;
    else if(A||T){ const who=A||T; stage=`<div class="fx-stage solo">${side(who,'t', x.k==='out'||!who.alive?'down': (x.amt<0?'sweat':'happy'))}</div>`; }
    else stage=`<div class="fx-event">${esc(x.head||'')}</div>`;
    box.innerHTML=`<div class="fx" role="dialog" aria-label="回合結算">
      <div class="fx-count">${esc(label||`第 ${G.round} 回合結算`)}　${i+1} / ${items.length}</div>
      <div class="fx-card k-${x.k||'misc'} ${x.k==='hit'?'fx-hit':''}"><div class="fx-head">${esc(head)}</div>${x.news?`<div class="fx-news">${esc(x.news)}</div>`:''}${stage}${x.quote?`<div class="fx-quote">「${esc(x.quote)}」</div>`:''}${amt}<p class="fx-text">${esc(x.text)}</p></div>
      <div class="fx-btns"><button id="fxskip">跳過</button><button id="fxnext" class="go">${i+1<items.length?'下一則':'看結果'}</button></div></div>`;
    sfx(x.k==='hit'?'hit':x.k==='rally'?'rally':x.k==='block'?'block':x.k==='skill'?'skill':x.k==='out'?'out':x.k==='event'?(x.head==='告急！'?'alarm':'event'):'event');
    $('#fxnext').onclick=()=>{ i++; show(); };
    $('#fxskip').onclick=finish;
    $('#fxnext').focus();
    fxTimer=setTimeout(()=>{ i++; show(); }, (x.k==='hit'?2900:2300) + (x.quote||x.news?400:0));
  };
  show();
}

/* ===== 遊戲畫面 ===== */
function renderGame(){
  const me=human();
  const ruleBar = [];
  if(G.rule && G.round<=G.rule.until) ruleBar.push(`修憲生效中：${RULES[G.rule.k]}（到第 ${G.rule.until} 回合）`);

  if(won){ x.save(); x.translate(300,360); x.rotate(0.2); x.fillStyle='#B3261E'; x.fillRect(-70,-30,140,60); x.strokeStyle='#14100C'; x.lineWidth=4; x.strokeRect(-70,-30,140,60); x.fillStyle='#F2E9D3'; x.font=`900 38px ${SERIF}`; x.textAlign='center'; x.fillText('當選',0,2); x.restore(); x.textAlign='left'; }
  // 感言
  const line=draw('share'+me.id, me.ch.lines);
  x.fillStyle='#FFFFFF'; x.fillRect(400,318,636,150); x.strokeStyle='#14100C'; x.lineWidth=5; x.strokeRect(400,318,636,150);
  x.fillStyle='#B3261E'; x.font=`900 28px ${SANS}`; x.fillText(won?'當選感言':'落選感言',424,350);
  x.fillStyle='#14100C'; x.font=`900 36px ${SERIF}`; wrapText(x,`「${line}」`,590).slice(0,2).forEach((l,i)=>x.fillText(l,424,398+i*46));
  // 最終票數
  x.font=`900 28px ${SANS}`; x.fillText('最終票數',400,500);
  const maxV=Math.max(1,...ord.map(p=>p.votes));
  const rows=ord.slice(0,Math.min(ord.length,5));
  for(let i=0;i<rows.length;i++){ const p=rows[i], y=528+i*26;
    x.font=`700 20px ${SANS}`; x.fillStyle='#14100C'; x.fillText(`${i+1}. ${p.name}${p.isHuman?'（你）':''}`,400,y+8);
    x.fillStyle='#CBBE9E'; x.fillRect(640,y,300,14); x.fillStyle= p.isHuman ? '#B3261E' : '#14100C'; x.fillRect(640,y,300*p.votes/maxV,14);
    x.fillStyle='#14100C'; x.textAlign='right'; x.fillText(p.alive?`${p.votes} 萬`:'出局',1036,y+8); x.textAlign='left'; }
  // 名場面
  const b=G.stats.big;
  x.fillStyle='#14100C'; x.fillRect(44,676,W-88,44); x.fillStyle='#E8DEC5'; x.font=`900 28px ${SERIF}`; x.fillText('本局名場面',60,699);
  x.fillStyle='#FFFFFF'; x.fillRect(44,720,W-88,110); x.strokeStyle='#14100C'; x.lineWidth=4; x.strokeRect(44,720,W-88,110);
  x.fillStyle='#14100C';
  if(b){ const t1=b.news||`${P(b.a).name}對${P(b.t).name}發動「${b.m}」`; x.font=`900 30px ${SERIF}`; wrapText(x,t1,W-130).slice(0,2).forEach((l,i)=>x.fillText(l,64,758+i*38));
    x.fillStyle='#B3261E'; x.font=`900 30px ${SANS}`; x.textAlign='right'; x.fillText(`${P(b.a).name} → ${P(b.t).name}　-${b.dmg} 萬`,W-64,812); x.textAlign='left'; }
  else { x.font=`900 30px ${SERIF}`; x.fillText('這局風平浪靜，沒有人被爆料。',64,775); }
  // 各項排行
  let aw=awardList();
  aw.sort((p,q)=>(q.id===me.id)-(p.id===me.id)); aw=aw.slice(0,6);
  x.fillStyle='#14100C'; x.font=`900 30px ${SERIF}`; x.fillText('各項排行',44,872);
  for(let i=0;i<aw.length;i++){ const a=aw[i], cx=44+(i%2)*504, cy=894+Math.floor(i/2)*92;
    x.fillStyle= a.id===me.id ? '#F1DA96' : '#F4EBD3'; x.fillRect(cx,cy,488,80); x.strokeStyle='#14100C'; x.lineWidth=3; x.strokeRect(cx,cy,488,80);
    try{ const im=await loadImg(art(a.id,'happy')); x.drawImage(im,cx+6,cy+6,68,68); }catch(e){}
    x.fillStyle='#14100C'; x.font=`900 26px ${SANS}`; x.fillText(`${a.icon} ${a.name}`,cx+84,cy+28);
    x.font=`700 24px ${SANS}`; x.fillText(`${P(a.id).name}${a.id===me.id?'（你）':''}　${a.x} ${a.unit}`,cx+84,cy+60); }
  // 報尾
  const fy=1180; x.fillStyle='#14100C'; x.fillRect(0,fy,W,H-fy);
  const url=CONFIG.SHARE_URL;
  try{ const q=qrcode(0,'M'); q.addData(url); q.make(); const n=q.getModuleCount(), size=140, cell=size/n;
    x.fillStyle='#FFFFFF'; x.fillRect(40,fy+15,size+16,size+16); x.fillStyle='#14100C';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) x.fillRect(48+c*cell,fy+23+r*cell,Math.ceil(cell),Math.ceil(cell)); }catch(e){}
  x.fillStyle='#D4A53A'; x.font=`900 30px ${SERIF}`; x.fillText('掃描加入選戰！',220,fy+42);
  x.fillStyle='#E8DEC5'; x.font=`700 20px ${SANS}`; wrapText(x,url,820).slice(0,1).forEach(l=>x.fillText(l,220,fy+78));
  x.font=`700 22px ${SANS}`; x.fillText(`挑戰碼：${G.seed}｜${me.name}｜${G.players.length-1} 位對手｜${G.max} 回合｜${DIFF[G.diff]}`,220,fy+114);
  x.fillStyle='#B5A78C'; x.font=`400 18px ${SANS}`; x.fillText('本遊戲純屬虛構諷刺，角色與真實人物之言行無關。',220,fy+148);
  return cv;
}
async function shareResult(kind){
  const box=$('#fx');
  box.innerHTML=`<div class="fx" role="dialog" aria-label="分享號外"><div class="fx-count">正在印製號外……</div></div>`;
  let url=null, blob=null;
  try{ const cv=await makeShareImage(kind); url=cv.toDataURL('image/png'); blob=await new Promise(r=>cv.toBlob(r,'image/png')); }
  catch(e){ box.innerHTML=`<div class="fx" role="dialog"><div class="fx-card"><div class="fx-head">印製失敗</div><p class="fx-text">這個瀏覽器無法產生圖片，請換一個瀏覽器再試。</p></div><div class="fx-btns"><button id="shclose" class="go">關閉</button></div></div>`; $('#shclose').onclick=()=>box.innerHTML=''; return; }
  const file = blob ? new File([blob],'election-war.png',{ type:'image/png' }) : null;
  const canShare = file && navigator.canShare && navigator.canShare({ files:[file] });
  box.innerHTML=`<div class="fx" role="dialog" aria-label="分享號外">
    <div class="fx-count">長按圖片可以儲存</div>
    <img class="share-img" src="${url}" alt="本局號外圖片">
    <div class="fx-btns"><button id="shclose">關閉</button>${canShare?'<button id="shgo" class="go">分享</button>':`<a id="shdl" class="go dl" href="${url}" download="election-war.png">下載圖片</a>`}</div></div>`;
  $('#shclose').onclick=()=>box.innerHTML='';
  const go=$('#shgo'); if(go) go.onclick=async()=>{ try{ await navigator.share({ files:[file], title:'選戰狂人夢', text:'來挑戰我的選戰！' }); }catch(e){} };
}

/* ===== 結局 ===== */
function checkAch(kind,win){
  if(!G || !G.hs) return [];
  const me=human(), won = kind!=='none' && kind!=='lost' && win && win.isHuman, hs=G.hs;
  const got=store.get('ew-ach',{}), wins=store.get('ew-wins',{});
  const earn=[];
  const add=(id,cond)=>{ if(cond && !got[id]){ got[id]=Date.now(); earn.push(ACH.find(a=>a.id===id)); } };
  if(won) wins[artKey(me.id)]=true;
  add('first', won);
  add('clean', won && hs.launched===0);
  add('comeback', won && hs.minVotes<20);
  add('alarmwin', won && hs.alarm);
  add('target', won && hs.hitsTaken>=8);
  add('wall', hs.blocks>=3);
  add('mega', hs.mega);
  add('six', won && G.players.length>=6);
  add('solo', won && kind==='solo');
  add('hard', won && G.diff==='hard');
  add('none', kind==='none');
  add('all', ORDER.every(id=>wins[artKey(id)]));
  store.set('ew-ach',got); store.set('ew-wins',wins);
  return earn;
}
function renderEnd(kind){
  const ranked=[...G.players].sort((a,b)=>(b.alive-a.alive)||(b.votes-a.votes)||(b.funds-a.funds));
  const top=ranked[0], second=ranked[1];
  let tie=false;
  if(kind==='vote' && second && second.alive && top.votes===second.votes && top.funds===second.funds){
    tie=true; if(R()<0.5){ ranked[0]=second; ranked[1]=top; }
  }
  const win=ranked[0], me=human();
  let head;
  if(kind==='none'){
    head=`<div class="cert"><h1>全民不投票</h1><p>所有候選人同時凍蒜失敗，投票所空無一人。</p><p>恭喜解鎖隱藏結局。</p></div>`;
  } else if(kind==='lost'){
    head=`<div class="cert"><h1>凍蒜失敗</h1><img class="art" src="${art(me.id,'down')}" alt=""><p>你在第 ${G.round} 回合退出選戰。</p><p>目前領先：${esc(win.name)}（${win.votes} 萬票）</p></div>`;
  } else if(win.isHuman){
    head=`<div class="cert"><h1>當選證書</h1><img class="art" src="${art(win.id,'happy')}" alt=""><p style="font-size:1.3rem;font-weight:900">${esc(win.name)}</p><p>以 ${win.votes} 萬票當選${kind==='solo'?'（對手全數凍蒜失敗）':''}${tie?'（同票抽籤勝出）':''}</p></div>`;
  } else {
    head=`<div class="cert"><h1>落選了</h1><img class="art" src="${art(win.id,'happy')}" alt=""><p>${esc(win.name)} 以 ${win.votes} 萬票當選${tie?'（同票抽籤）':''}。</p><p>你得到 ${me.votes} 萬票。</p></div>`;
  }
  const maxV=Math.max(1,...ranked.map(p=>p.votes));
  const hl=[];
  const b=G.stats.big;
  if(b) hl.push(`單次最大傷害：${nm(P(b.a))}對${nm(P(b.t))}的「${b.m}」，-${b.dmg} 萬`);
  const hits=Object.entries(G.stats.hits).sort((x,y)=>y[1]-x[1])[0];
  if(hits) hl.push(`最常被爆料：${nm(P(hits[0]))}，共 ${hits[1]} 次`);
  const ral=Object.entries(G.stats.rally).sort((x,y)=>y[1]-x[1])[0];
  if(ral) hl.push(`造勢最多票：${nm(P(ral[0]))}，共 ${ral[1]} 萬`);
  const lastE=G.log[0];
  const newAch=checkAch(kind,win);
  sfx(kind!=='none' && kind!=='lost' && win.isHuman ? 'win' : 'lose');
  $('#app').innerHTML = `
  <div class="wrap">
    ${head}
    ${newAch.length?`<section class="block"><h2>解鎖成就</h2><ul class="achs">${newAch.map(a=>`<li class="got"><b>🏅 ${esc(a.name)}</b><span>${esc(a.desc)}</span></li>`).join('')}</ul></section>`:''}
    <section class="block"><h2>最終票數</h2>
      <ol class="rank">${ranked.map((p,i)=>`<li><span>${i+1}</span><img class="art" src="${art(p.id,p.alive?(i===0?'happy':'sweat'):'down')}" alt=""><span class="n">${esc(p.name)}${p.isHuman?'（你）':''}</span><span class="bar"><i style="width:${p.votes/maxV*100}%"></i></span><span>${p.alive?p.votes+' 萬':'出局'}</span></li>`).join('')}</ol>
    </section>
    <button class="primary" id="share">📰 分享本局號外</button>
    ${awardsHtml()}
    ${hl.length?`<section class="block"><h2>本局名場面</h2><ul class="hl">${hl.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
    ${lastE?`<section class="block log"><h2>最後一回合（第 ${lastE.r} 回合）發生了什麼</h2><ul>${logLines(lastE)}</ul></section>`:''}
    <p class="fine">種子碼：${esc(G.seed)}　（相同種子碼、角色與設定可重現本局）</p>
    <button class="primary" id="again">同一位候選人再戰一局</button>
    <button class="link" id="back">重新選角</button>
    <section class="block log"><h2>完整選戰記錄</h2>${logHtml(0)}</section>
  </div>`;
  $('#share').onclick=()=>shareResult(kind);
  $('#again').onclick=()=>{ SETUP.seed=''; startGame(); };
  $('#back').onclick=()=>{ SETUP.seed=''; renderSetup(); };
  window.scrollTo(0,0);
}

renderSetup();
